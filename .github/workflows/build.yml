name: Build and publish system extensions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - .github/workflows/pages.yml
      - packages/**
      - targets/**
      - tools/**
      - tests/**
      - meson.build
      - meson.options
      - repository.json
      - LICENSE
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install shared test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends meson ninja-build squashfs-tools git-lfs
      - name: Check shared tooling, repository assembly, and the build graph
        run: |
          meson setup "$RUNNER_TEMP/check"
          meson test -C "$RUNNER_TEMP/check" --suite unit --print-errorlogs
      - name: Discover package and architecture targets
        id: catalog
        run: |
          matrix=$(python3 tools/repository.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  extensions:
    needs: catalog
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Matrix entries use independent native runners and build directories.
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    env:
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install build and test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends meson ninja-build squashfs-tools binutils openssh-client util-linux build-essential
      - name: Configure package build
        run: meson setup "$RUNNER_TEMP/build" -Dpackages="$PACKAGE" -Dtarget="$TARGET" -Dintegration_tests=true
      - name: Build extension
        run: meson compile -C "$RUNNER_TEMP/build"
      - name: Verify unchanged builds do no work
        run: ninja -C "$RUNNER_TEMP/build" -n | tee "$RUNNER_TEMP/incremental.txt" && grep -q 'no work to do' "$RUNNER_TEMP/incremental.txt"
      - name: Run package smoke tests
        run: meson test -C "$RUNNER_TEMP/build" --suite smoke --print-errorlogs
      - name: Run available integration suites in private namespaces
        run: |
          if python3 -c 'import json, os; p = json.load(open("packages/" + os.environ["PACKAGE"] + "/package.json")); raise SystemExit("integration" not in p.get("tests", {}))'; then
            sudo meson test -C "$RUNNER_TEMP/build" --suite integration --print-errorlogs
          fi
      - name: Create verified distribution bundle
        run: meson compile -C "$RUNNER_TEMP/build" bundles
      - name: Retain distribution bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.package }}-${{ matrix.target }}
          path: ${{ runner.temp }}/build/*.bundle.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Retain test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.package }}-${{ matrix.target }}
          path: ${{ runner.temp }}/build/meson-logs/
          retention-days: 7

  repository:
    needs: extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.PACKAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install image inspection tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: ${{ runner.temp }}/bundles
      - name: Verify all bundles and generate module store declarations
        env:
          LFS_BASE_URL: https://media.githubusercontent.com/media/${{ github.repository }}/gh-pages
        run: |
          python3 tools/repository.py build --bundles "$RUNNER_TEMP/bundles" \
            --output "$RUNNER_TEMP/site" --base-url "$BASE_URL" \
            --lfs-base-url "$LFS_BASE_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-repository
          path: ${{ runner.temp }}/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install Git LFS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-lfs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-repository
          path: ${{ runner.temp }}/site
      - name: Upload LFS content and publish the module repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/publication.py publish --site "$RUNNER_TEMP/site" \
            --remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            --message "Publish module repository from $GITHUB_SHA"
