name: Deploy GitHub Pages

on:
  # GITHUB_TOKEN pushes do not trigger push workflows. Deploy after a
  # successful package publication without requiring a separate token.
  workflow_run:
    workflows: [Build and publish system extensions]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Read the publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: gh-pages
          path: published
          lfs: false
          persist-credentials: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Install Git LFS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-lfs
      - name: Exclude LFS files from the Pages payload
        run: python3 source/tools/publication.py prepare-pages --checkout published
      - name: Verify published download origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! pages_base_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url); then
            echo '::error::Cannot read the Pages site. Enable Pages once in Settings > Pages with GitHub Actions as the source, then rerun this deployment.'
            exit 1
          fi
          PAGES_BASE_URL="$pages_base_url" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          configured = urlsplit(os.environ['PAGES_BASE_URL'].rstrip('/'))
          generated = urlsplit(json.loads(Path('published/repository.json').read_text())['base_url'])
          if (configured.scheme, configured.hostname, configured.path) != (generated.scheme, generated.hostname, generated.path):
              raise SystemExit('Set the PACKAGES_BASE_URL repository variable to the configured GitHub Pages URL and rerun the package build.')
          PY
      - name: Verify Pages payload size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path('published').rglob('*') if '.git' not in p.parts and p.is_file()]
          if sum(p.stat().st_size for p in files) >= 1024 ** 3:
              raise SystemExit('Publication branch exceeds the GitHub Pages 1 GiB site limit.')
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: published
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
